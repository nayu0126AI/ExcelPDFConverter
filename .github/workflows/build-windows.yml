name: Windows版exeを作成

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 必要なライブラリを準備
        run: python -m pip install -r requirements-dev.txt

      - name: 自動テスト
        run: python -m pytest -q

      - name: exeを作成
        run: python -m PyInstaller --clean --noconfirm ExcelPDFConverter.spec

      - name: 完成したexeを保存
        uses: actions/upload-artifact@v4
        with:
          name: ExcelPDFConverter-Windows
          path: dist/ExcelPDFConverter.exe
          if-no-files-found: error

